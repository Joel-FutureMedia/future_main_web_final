server {
    listen 5001;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ ^/(.+)/$ {
        try_files /$1.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
